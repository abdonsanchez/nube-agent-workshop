AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EcoBot — Asistente de Logística y Devolución Sustentable

Globals:
  Function:
    PermissionsBoundary: arn:aws:iam::939003236548:policy/hackathon-boundary

Resources:

  EcoBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ecobot-agent
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 120
      CodeUri: src/
      Environment:
        Variables:
          SESSIONS_TABLE: agent-sessions
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/ecobot-execution-role"

  EcoBotApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: ecobot-api

  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EcoBotApi
      ParentId: !GetAtt EcoBotApi.RootResourceId
      PathPart: chat

  ChatMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EcoBotApi
      ResourceId: !Ref ChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${EcoBotFunction.Arn}/response-streaming-invocations"

  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EcoBotApi
      ResourceId: !GetAtt EcoBotApi.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${EcoBotFunction.Arn}/response-streaming-invocations"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ChatMethod, RootMethod]
    Properties:
      RestApiId: !Ref EcoBotApi

  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref EcoBotApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt EcoBotFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EcoBotApi}/*"

Outputs:
  EcoBotUrl:
    Description: EcoBot chat URL
    Value: !Sub "https://${EcoBotApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
