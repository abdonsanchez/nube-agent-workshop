AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Nube agent \u2014 a serverless AI agent with streaming responses. This\
  \ file IS your architecture: one function, one API, nothing else.\n"
Resources:
  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nube-agent
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
      - arm64
      MemorySize: 512
      Timeout: 120
      CodeUri: AgentFunction
      Environment:
        Variables:
          PRODUCTS_TABLE: product-catalog
          SESSIONS_TABLE: agent-sessions
      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/nube-agent-execution-role
    Metadata:
      SamResourceId: AgentFunction
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: nube-agent-api
  ChatResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId:
        Ref: Api
      ParentId:
        Fn::GetAtt:
        - Api
        - RootResourceId
      PathPart: chat
  ChatMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: Api
      ResourceId:
        Ref: ChatResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AgentFunction.Arn}/response-streaming-invocations
  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:
        Ref: Api
      ResourceId:
        Fn::GetAtt:
        - Api
        - RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        ResponseTransferMode: STREAM
        TimeoutInMillis: 29000
        Uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${AgentFunction.Arn}/response-streaming-invocations
  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
    - ChatMethod
    - RootMethod
    Properties:
      RestApiId:
        Ref: Api
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/nube-agent
      RetentionInDays: 7
  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId:
        Ref: Api
      DeploymentId:
        Ref: Deployment
      StageName: prod
      AccessLogSetting:
        DestinationArn:
          Fn::GetAtt:
          - AccessLogGroup
          - Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength"}'
  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Fn::GetAtt:
        - AgentFunction
        - Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*
Outputs:
  ChatPage:
    Description: Open this URL in your browser to chat with your agent
    Value:
      Fn::Sub: https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/
